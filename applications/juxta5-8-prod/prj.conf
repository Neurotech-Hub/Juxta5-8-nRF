# Juxta5-8 production firmware: Hublink BLE + NOR CSV logging

CONFIG_GPIO=y
CONFIG_ADC=y

# SAADC gates analog front-end via runtime PM inside each adc_read.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# Internal nRF52840 flash settings store.
# 4 sectors × 4 KB = 16 KB of the 64 KB storage_partition.  The log-cache
# struct grew with JUXTA_MAX_FILES=48 (~1.5 KB per write) and is rewritten
# ~3×/day at calendar rotation, so 4 sectors give NVS comfortable GC margin
# over a 12-day deployment while staying well under the 10 k internal-flash
# erase budget.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=4
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# GATT client role required for bt_gatt_exchange_mtu() (MTU negotiation).
CONFIG_BT_GATT_CLIENT=y

# Bluetooth Hublink peripheral + observer.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="JX_CONNECT"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
# Advertise peripheral preferred connection parameters in the GATT GAP service
# so iOS can read our preferences before the explicit update request.
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_MAX_CONN=1
CONFIG_BT_HCI_ERR_TO_STR=y

# Match legacy juxta-ble transfer envelope.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_SMP=n
CONFIG_BT_SIGNING=n
CONFIG_BT_ATT_PREPARE_COUNT=0
CONFIG_BT_PRIVACY=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_BUF_EVT_RX_COUNT=2
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=2

# MCUboot image upload over mcumgr SMP BLE (DFU mode after long magnet hold).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_DYNAMIC_SVC_REGISTRATION=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# Logging over RTT.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
# Production logging profile: drop log entries when the RTT FIFO fills
# instead of blocking the caller.  BLOCK_IF_FIFO_FULL is fine on the bench
# with a J-Link draining RTT, but in the field with no host attached the
# first burst of logs (file offload, NOR erase) fills the FIFO and stalls
# the logging thread — and under CONFIG_LOG_MODE_IMMEDIATE the *caller*
# (BT RX, system workqueue) — forever, producing the "device goes quiet"
# silent-hang symptom.  NO_BLOCK_SKIP makes that impossible.
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_UART_CONSOLE=n

# DIAGNOSTIC BUILD: synchronous (immediate) logging.
# Each LOG_*() call writes directly to RTT instead of being queued in the
# deferred ring buffer for the logging thread to drain.  This eliminates the
# "N messages dropped" lines that appear under burst load (scan flush, vitals
# flash_append loop) and *guarantees* that the last log line emitted before
# any hang or watchdog reset reaches RTT — which is the whole point of this
# diagnostic build.  Trade-off: LOG_* calls block the caller on RTT for the
# duration of each write (a few hundred microseconds per line), so hot paths
# get slightly slower.  Acceptable given the 5 s WDT window.  Revert to
# deferred mode (remove this line) once the silent-hang root cause is found.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=2048
# BT RX WQ runs every GATT write callback inline (apply_gateway_command,
# write_filename_char, etc.).  The deepest sync-gate call chain
# (sscanf-based JSON parsing + file listing/transfer) measured 3368 / 4096
# bytes = 82 % at the end of wait_for_datetime_sync — right at the README
# diagnostics "investigate" threshold.  Bumped to 6144 to keep peak usage
# below 60 % so future code-path growth (or a deeper transient call chain)
# does not cause a stack overrun under field load.  Costs +2 KB RAM.
CONFIG_BT_RX_STACK_SIZE=6144
CONFIG_BT_HCI_TX_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=8192

# P0.09 is NFC; use as GPIO for LED0.
CONFIG_NFCT_PINS_AS_GPIOS=y

# sys_poweroff() for shelf mode (nRF52840 System OFF, magnet GPIO wake).
CONFIG_POWEROFF=y
# sys_reboot() for debug simulation loop (shelf mode emulation with J-Link).
CONFIG_REBOOT=y

# Watchdog and production reliability.
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y

# POFCON supply-droop witness (src/juxta_pof.c).  The nrfx POWER driver
# provides nrfx_power_pof_init/enable; its IRQ shares the POWER_CLOCK vector
# already connected by the clock driver (nrfx_power_clock_irq_handler
# dispatches to both nrfx_power and the MPSL clock handler).
CONFIG_NRFX_POWER=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_FAULT_DUMP=2

# Diagnostic: per-thread stack high-water marks logged via RTT every vitals
# tick (60 s default).  Pre-fills stacks with 0xAA so the analyzer can compute
# how much of each stack has ever been touched.  Drive thread_analyzer_print()
# manually from vitals_work_handler — no AUTO thread, so no extra RAM cost.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y
