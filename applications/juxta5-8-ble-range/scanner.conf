# Kconfig fragment: BLE range test — scanner role (passive scan + LED).
# Add this in nRF Connect build configuration as an extra Kconfig fragment, or:
#   west build ... -- -DEXTRA_CONF_FILE=scanner.conf
#
CONFIG_JUXTA_BLE_RANGE_ROLE_SCANNER=y

# Optional: LED only when this exact local name is seen (set to your advertiser’s JX_…).
# CONFIG_JUXTA_RANGE_PEER_NAME="JX_AABBCC"
